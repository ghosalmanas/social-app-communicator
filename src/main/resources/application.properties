# ====================================
# Application Configuration
# ====================================
spring.application.name=WA_TG_FB_SeleniumFreelancerAppV2

# ========= Social App flags =================
onlyAllowAllBroadcastsWATGFB=false
onlyAllowAllFetchAndJoinsWATG=false

whatsapp.group.broadcast.enabled=true
telegram.group.broadcast.enabled=false
facebook.group.broadcast.enabled=false
facebook.group.broadcast.sensitive.enabled=false
wantToAttachAdvertisingImage=false

whatsapp.fetch.contacts.enabled=false
telegram.fetch.contacts.enabled=false

# ========= Message End Line =================
wantToClearIfDraftedBeforeSend=false
wantToAddMillisAtMessageEndToMakeEachMessageUnique=true
isWarningNoteToAddAsMarketIsDownAndConsultantsAreNotContacting=false
facebook.group.broadcast.sensitive.enabled.with.proxy.message=true
facebook.group.broadcast.clear.pending.staged.message.before.posting=false
daysToSubtract=3
wa.waitForLoadingAllChatsForGroupJoiningDuringTraversal=true

# ====================================
# DevTools Configuration
# ====================================
spring.devtools.livereload.enabled=true
spring.devtools.restart.enabled=true
spring.devtools.restart.exclude=static/**,templates/**,public/**
spring.devtools.restart.poll-interval=1s
spring.devtools.restart.quiet-period=400ms
spring.devtools.add-properties=true

# ====================================
# Spring Boot Configuration
# ====================================
spring.main.lazy-initialization=true
spring.main.allow-circular-references=true
spring.main.allow-bean-definition-overriding=true

# ====================================
# Server Configuration
# ====================================
server.port=8082
server.servlet.context-path=/
server.servlet.session.timeout=86400
server.servlet.session.persistent=true
server.servlet.session.store-dir=./session-store
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
server.compression.min-response-size=2KB

# ====================================
# Chrome and ChromeDriver Configuration
# ====================================
# Leave empty to use latest stable version
# Specify ChromeDriver version (optional)
webdriver.chrome.driver.version=
# Path to Chrome binary (optional)
webdriver.chrome.binary=
# Additional Chrome arguments
webdriver.chrome.args=--no-sandbox,--disable-dev-shm-usage,--remote-debugging-port=9222
# Enable/disable headless mode
# Timeouts in seconds
webdriver.timeout.pageLoad=300
webdriver.timeout.implicit=30
# Maximum retry attempts for WebDriver creation
webdriver.retry.attempts=3

# ====================================
# Error Handling Configuration
# ====================================
server.error.path=/error
server.error.include-exception=true
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=ON_PARAM
server.error.whitelabel.enabled=false
spring.mvc.throw-exception-if-no-handler-found=true
spring.resources.cache.period=0

# ====================================
# Static Resources Configuration
# ====================================
spring.web.resources.add-mappings=true
spring.web.resources.static-locations=classpath:/static/
spring.mvc.static-path-pattern=/**

# ====================================
# Selenium & WebDriver Configuration
# ====================================
# General Settings
selenium.health.check.enabled=true
selenium.health.check.max.instances=0
selenium.chrome.extension.required=false
selenium.chrome.extension.path=extensions/webextensions-selenium-example.crx

# Chrome Options
webdriver.headless=false
# Leave empty to use system default Chrome
webdriver.chrome.version=
# Use WebDriverManager to handle ChromeDriver

# Timeout Settings (seconds)
webdriver.timeout.explicit=15
selenium.page.load.timeout.seconds=60
selenium.implicit.wait.seconds=20
selenium.explicit.wait.seconds=10

# Selenium Configuration
selenium.window.width=1920
selenium.window.height=1080
selenium.screenshot.enabled=true
selenium.screenshot.directory=./screenshots

# WebDriverManager Configuration
wdm.chromedriver.forceDownload=false
wdm.chromedriver.useMirror=false
wdm.chromedriver.httpsProtocol=TLSv1.2
wdm.cachePath=./.webdrivermanager
wdm.timeout=30
wdm.versionsToDownload=3

# Parallel Execution Configuration
parallel.core.pool.size=5
parallel.max.pool.size=10
parallel.queue.capacity=25

# ====================================
# WhatsApp Configuration
# ====================================
whatsapp.web.url=https://web.whatsapp.com
whatsapp.qr.wait.seconds=30
whatsapp.headless=false

# ====================================
# Telegram Configuration
# ====================================
telegram.web.url=https://web.telegram.org
telegram.login.wait.seconds=60
telegram.headless=false

# ====================================
# XPath Interface Configuration
# ====================================
telegram.xpath.interface.watg=com.wtf.app.model.xpaths.XPathInterfaceWATG
telegram.xpath.interface.default=com.wtf.app.model.xpaths.XPathInterface
telegram.social.type=TELEGRAM
telegram.profile=telegram-profile

# ====================================
# Retry Configuration
# ====================================
automation.max.retries=3
automation.retry.delay.ms=1000
automation.retry.multiplier=2
app.max.retry.attempts=3
app.retry.delay.millis=1000

# ====================================
# Profile and Path Configuration
# ====================================
# Use system temp directory for profiles
# For Chrome profile persistence (to reuse Facebook login):
# Copy your Chrome profile to this location and use it instead of the original
# This avoids conflicts with your regular Chrome browser
# To copy: Copy C:/Users/Manas/AppData/Local/Google/Chrome/User Data/Default to C:/temp/chrome-profiles/Default
browser.profile.directory=C:/temp/chrome-profiles

# Enable profile persistence to keep login sessions
webdriver.profile.persist=true

# Facebook profile name (Default, Profile 1, Profile 2, etc.)
webdriver.fb.profile=Default

webdriver.wa.profile=whatsapp-profile
webdriver.tg.profile=telegram-profile

# Enable monitoring
logging.level.com.wtf.app.aspect.MonitoringAspect=INFO





# Session Management
webdriver.session.timeout.minutes=1440
webdriver.cleanup.interval.minutes=30
webdriver.max.retry.attempts=3

# Broadcast Settings
broadcast.batch.size=20
broadcast.delay.between.messages.ms=2000-5000
broadcast.max.retries=3

# Logging
logging.level.com.wtf.app=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=WARN
logging.level.org.openqa.selenium=WARN
logging.file.name=logs/whatsapp-broadcast-${spring.application.name}.log
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# HTTP client settings
http.client.connection.timeout=30000
http.client.socket.timeout=30000
http.client.connection.request.timeout=30000