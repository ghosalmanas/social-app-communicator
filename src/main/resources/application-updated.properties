# ============================================================
# = WEB CONFIGURATION
# ============================================================
server.port=8082
server.servlet.context-path=/
server.tomcat.max-threads=200
server.tomcat.accept-count=100
server.tomcat.max-connections=10000

# ============================================================
# = SPRING DATASOURCE (H2 Embedded Database)
# ============================================================
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ============================================================
# = JPA / HIBERNATE
# ============================================================
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.format_sql=true

# ============================================================
# = LOGGING
# ============================================================
logging.level.root=INFO
logging.level.com.wtf=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.file.name=logs/application.log
logging.file.max-size=10MB
logging.file.max-history=7

# ============================================================
# = WEBDRIVER CONFIGURATION
# ============================================================

# ChromeDriver Settings
webdriver.chrome.driver=chromedriver/chromedriver-win64/chromedriver.exe
webdriver.chrome.silent=true
webdriver.chrome.log-level=SEVERE
webdriver.chrome.headless=false

# Timeout Settings (in seconds)
webdriver.timeout.page-load=300
webdriver.timeout.implicit=50
webdriver.timeout.script=30

# Window Settings
webdriver.window.maximize=true
webdriver.window.width=1920
webdriver.window.height=1080

# Profile and Downloads
webdriver.profile.base-dir=${user.home}/.selenium/profiles
webdriver.downloads.dir=${user.home}/Downloads/selenium-downloads

# ============================================================
# = WEBDRIVER POOL CONFIGURATION
# ============================================================

# Pool Size
webdriver.pool.max-total=10
webdriver.pool.max-idle=5
webdriver.pool.min-idle=1

# Pool Eviction
webdriver.pool.time-between-eviction-runs-millis=30000
webdriver.pool.min-evictable-idle-time-millis=60000
webdriver.pool.soft-min-evictable-idle-time-millis=30000

# Pool Testing
webdriver.pool.test-on-borrow=true
webdriver.pool.test-on-return=false
webdriver.pool.test-while-idle=true

# ============================================================
# = WHATSAPP CONFIGURATION
# ============================================================
whatsapp.qr-code.timeout=300
whatsapp.qr-code.refresh-interval=5
whatsapp.message.retry-count=3
whatsapp.message.retry-delay=1000

# ============================================================
# = TELEGRAM CONFIGURATION
# ============================================================
telegram.api.id=your_telegram_api_id
telegram.api.hash=your_telegram_api_hash

# ============================================================
# = FACEBOOK CONFIGURATION
# ============================================================
facebook.email=your_facebook_email
facebook.password=your_facebook_password

# ============================================================
# = ASYNC CONFIGURATION
# ============================================================
spring.task.execution.pool.core-size=10
spring.task.execution.pool.max-size=20
spring.task.execution.pool.queue-capacity=50
spring.task.execution.thread-name-prefix=async-exec-

# ============================================================
# = CACHE CONFIGURATION
# ============================================================
spring.cache.type=simple
spring.cache.cache-names=webdriver-sessions,user-sessions

# ============================================================
# = SECURITY CONFIGURATION (Basic Auth for Actuator)
# ============================================================
# Uncomment and configure as needed
#management.endpoints.web.exposure.include=health,info,metrics,prometheus
#management.endpoint.health.show-details=when_authorized
#management.endpoint.health.show-components=when_authorized
#spring.security.user.name=admin
#spring.security.user.password=admin

# ============================================================
# = METRICS AND MONITORING
# ============================================================
management.metrics.export.prometheus.enabled=true
management.metrics.enable.all=true
management.endpoint.metrics.enabled=true
management.endpoint.prometheus.enabled=true
management.endpoint.health.show-details=always

# ============================================================
# = MISCELLANEOUS
# ============================================================
# Enable/disable specific features
app.feature.whatsapp.enabled=true
app.feature.telegram.enabled=true
app.feature.facebook.enabled=true

# Debug mode (for development only)
app.debug.mode=false

# Session timeout (in seconds)
server.servlet.session.timeout=1800

# File upload settings
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
