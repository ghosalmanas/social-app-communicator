# WebDriver Pool Configuration
webdriver.pool.max-total=10
webdriver.pool.max-idle=5
webdriver.pool.min-idle=1
webdriver.pool.test-on-borrow=true
webdriver.pool.test-on-return=false
webdriver.pool.test-while-idle=true
webdriver.pool.time-between-eviction-runs-millis=30000
webdriver.pool.min-evictable-idle-time-millis=60000

# WebDriver Timeout Configuration
webdriver.timeout.page-load=300
webdriver.timeout.implicit=50
webdriver.timeout.script=30

# WebDriver Settings
webdriver.headless=false
webdriver.window-size=1920,1080

# ChromeDriver Settings
webdriver.chrome.silent-output=true
webdriver.chrome.log-level=SEVERE

# Profile Settings
webdriver.profile.base-dir=${user.dir}/profiles
webdriver.profile.prefix=profile_
